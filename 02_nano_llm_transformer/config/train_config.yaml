# Pretraining hyperparameters tuned for a single 6GB GPU (GTX 1060, no tensor cores).

pretrain:
  batch_size: 16
  grad_accum_steps: 4        # effective batch size 64
  max_steps: 1000             # cut short for a quick "basic functionality" pass (~35 more min resumed from step 200); raise this and re-run --resume for a better model later
  eval_interval: 250
  eval_iters: 50
  log_interval: 20
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 150
  weight_decay: 0.1
  grad_clip: 1.0
  amp_dtype: float16          # Pascal has no bf16 tensor cores
  compile: false              # torch.compile is flaky on Windows; kept off by default
  seed: 1337
  smoke_test_steps: 200        # used by scripts/train_pretrain.py --smoke-test

sft:
  batch_size: 8
  grad_accum_steps: 4
  epochs: 1              # cut short for a quick pass; raise for better instruction-following later
  eval_interval: 100
  log_interval: 20
  lr: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.05
  grad_clip: 1.0
  amp_dtype: float16
  seed: 1337
  smoke_test_steps: 50
