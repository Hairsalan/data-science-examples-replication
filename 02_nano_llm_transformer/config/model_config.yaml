# Architecture of the nano LLM.
# ~26M parameters — sized to comfortably fit a 6GB laptop GPU (GTX 1060)
# while still using modern, "state of the art" primitives at small scale:
# RoPE positional embeddings, RMSNorm, SwiGLU MLP, grouped-query attention (GQA),
# and weight tying between the input embedding and output head.

vocab_size: 8192       # trained fresh on TinyStories via data_preparation (small vocab keeps embedding table tiny)
block_size: 512        # max context length (tokens)
n_layer: 8
n_embd: 512
n_head: 8               # query heads
n_kv_head: 2             # key/value heads (GQA: n_head must be divisible by n_kv_head)
dropout: 0.0
rope_theta: 10000.0
norm_eps: 1.0e-5
tie_weights: true
